# yaml-language-server: $schema=https://agentgateway.dev/schema/config
config:
  database:
    url: sqlite:///root/.config/agentgateway/data.db
gateways:
  default:
    port: 4000
ui:
  gateways: default
llm:
  models:
  - name: openai/*
    provider: openAI
    params:
      apiKey: $OPENAI_API_KEY
    transformation:
      model: llmRequest.model.stripPrefix("openai/")
    guardrails:
      response:
      - regex:
          action: mask
          rules:
          - builtin: phoneNumber