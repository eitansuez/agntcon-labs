---
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayBackend
metadata:
  name: mcp-standard-backend
spec:
  entMcp:
    toolMode: Standard
    targets:
    - name: mcp-target
      static:
        backendRef:
          name: mcp-everything
        port: 3001
        protocol: StreamableHTTP