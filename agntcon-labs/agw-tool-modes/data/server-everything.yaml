---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-everything
  labels:
    app: mcp-everything
spec:
  selector:
    matchLabels:
      app: mcp-everything
  template:
    metadata:
      labels:
        app: mcp-everything
    spec:
      containers:
      - name: mcp-everything
        image: node:20-alpine
        command: ["npx"]
        args:
        - "-y"
        - "@modelcontextprotocol/server-everything"
        - "streamableHttp"
        ports:
        - containerPort: 3001
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-everything
  labels:
    app: mcp-everything
spec:
  selector:
    app: mcp-everything
  ports:
  - port: 3001
    targetPort: 3001
    appProtocol: agentgateway.dev/mcp