title: LLM consumption cost management with agentgateway OSS
description: Explore agentgateway features designed to help manage and control LLM costs.
author: Eitan Suez
time_limit: 15m
badge_id: 17424c31-9585-4d52-98e0-f396576b17da
tags:
- llm
- agentgateway
- cost
# Redis and the rate-limit server sit next to agentgateway.
# 2 GB leaves room for both containers and the gateway.
memory_mib: 2048
vcpus: 2
# scripts/labs saves a snapshot once this disk is current. Launch does not read this.
snapshot: true
# The name on the left is the guest variable. $OPENAI_API_KEY is copied from
# the catalog process environment when the session starts.
env:
  OPENAI_API_KEY: $OPENAI_API_KEY
# The bar above the lesson. The link opens on its own hostname so the
# guest still serves /ui at the root of this port.
services:
  - name: Agentgateway UI
    port: 4000
    path: /ui
